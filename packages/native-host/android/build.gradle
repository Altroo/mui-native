apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
android {
  namespace "com.altroo.muinativehost"
  compileSdkVersion rootProject.ext.has("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 37
  defaultConfig { minSdkVersion rootProject.ext.has("minSdkVersion") ? rootProject.ext.minSdkVersion : 24; targetSdkVersion 37 }
  sourceSets { main.java.srcDirs += "build/generated/source/codegen/java" }
}
repositories { google(); mavenCentral() }
dependencies { implementation "com.facebook.react:react-android" }
react { libraryName = "AltrooMuiNativeHostSpec"; codegenJavaPackageName = "com.altroo.muinativehost" }

// Compile and execute the pure lifecycle policy without an Android device/JUnit dependency.
tasks.register("verifyPickerPolicy", JavaExec) {
  group = "verification"
  dependsOn("compileDebugUnitTestKotlin", "compileDebugUnitTestJavaWithJavac")
  classpath = files(providers.provider { tasks.named("testDebugUnitTest").get().classpath })
  mainClass.set("com.altroo.muinativehost.PickerPresentationStateTestKt")
}


// Device-free portal attachment and affine-composition policy assertions.
tasks.register("verifyPortalPolicy", JavaExec) {
  group = "verification"
  dependsOn("compileDebugUnitTestKotlin", "compileDebugUnitTestJavaWithJavac")
  classpath = files(providers.provider { tasks.named("testDebugUnitTest").get().classpath })
  mainClass.set("com.altroo.muinativehost.PortalPresentationStateTestKt")
}

// Device-free clipping intersection and density policy assertions.
tasks.register("verifyPortalObservationPolicy", JavaExec) {
  group = "verification"
  dependsOn("compileDebugUnitTestKotlin", "compileDebugUnitTestJavaWithJavac")
  classpath = files(providers.provider { tasks.named("testDebugUnitTest").get().classpath })
  mainClass.set("com.altroo.muinativehost.PortalObservationRectTestKt")
}

// The actual hardware sequence policy, including popup close/focus-change races.
tasks.register("verifyDescendantKeyPolicy", JavaExec) {
  group = "verification"
  dependsOn("compileDebugUnitTestKotlin", "compileDebugUnitTestJavaWithJavac")
  classpath = files(providers.provider { tasks.named("testDebugUnitTest").get().classpath })
  mainClass.set("com.altroo.muinativehost.DescendantKeyPolicyTestKt")
}

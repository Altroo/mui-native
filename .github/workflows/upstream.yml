name: Upstream Updates
on:
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-updates
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm upstream:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-report
          path: artifacts/upstream/
          retention-days: 30
  prepare:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: upstream-report
          path: artifacts/upstream
      - run: node scripts/upstream/publish-report.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

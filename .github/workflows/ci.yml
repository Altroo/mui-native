name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate branch to validate
        required: false
        default: main
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Leave room for Node/runner overhead while reducing native TypeScript GC churn.
      GOMEMLIMIT: 9GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep every pnpm check gate explicit so a stopped runner retains the
      # exact failing phase and its completed predecessor results.
      - name: Lint, types and unused-code checks
        run: pnpm lint
      - name: Runtime and tooling contracts
        run: pnpm test
      - name: Coverage inventory freshness
        run: pnpm coverage:verify
      - name: Package builds
        run: pnpm build
      - name: Consumer declaration contracts
        run: pnpm typecheck:consumer
      - name: Native host code generation
        run: pnpm native-host:codegen
      - run: pnpm test:consumer
      - run: pnpm format:check
